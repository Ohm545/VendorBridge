<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Activity Logs — VendorBridge Admin</title>
<link rel="stylesheet" href="/admin/admin.css"/>
</head>
<body>
<div class="admin-layout">
  <div id="sidebarMount"></div>
  <div class="main-content">
    <header class="topbar">
      <button class="topbar-btn topbar-hamburger" id="hamburger"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="topbar-title">Activity Logs <span class="topbar-subtitle">Full audit trail</span></div>
      <div class="topbar-actions">
        <button class="topbar-btn" onclick="loadLogs(1)" title="Refresh">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </button>
        <a href="notifications.html" class="topbar-btn" style="position:relative">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="notif-dot" id="notifDot" style="display:none"></span>
        </a>
      </div>
    </header>
    <main class="page-body">
      <div class="page-header">
        <div class="page-header-left"><h1>Activity Logs</h1><p>Every action performed in the system</p></div>
        <div class="page-header-actions">
          <div style="display:flex;gap:8px">
            <button class="btn btn-outline" onclick="setDateFilter('today')">Today</button>
            <button class="btn btn-outline" onclick="setDateFilter('week')">This Week</button>
            <button class="btn btn-outline" onclick="setDateFilter('month')">This Month</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="filters-bar" style="margin:0;flex:1">
            <div class="search-wrap">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input class="search-input" id="searchInput" placeholder="Search actions, users, descriptions..." oninput="debouncedLoad()"/>
            </div>
            <select class="filter-select" id="entityFilter" onchange="loadLogs(1)">
              <option value="">All Modules</option>
            </select>
            <input type="date" class="filter-select" id="fromDate" onchange="loadLogs(1)" style="min-width:140px"/>
            <input type="date" class="filter-select" id="toDate" onchange="loadLogs(1)" style="min-width:140px"/>
          </div>
        </div>
        <div id="logsContainer">
          <div class="empty-state"><p>Loading logs...</p></div>
        </div>
        <div class="pagination" id="logsPagination"></div>
      </div>
    </main>
  </div>
</div>
<script src="/admin/admin.js"></script>
<script>
fetch('/admin/sidebar.html').then(r=>r.text()).then(h=>{
  document.getElementById('sidebarMount').innerHTML=h;
  initAdminPage('activity');
  loadEntityTypes();
  loadLogs(1);
});

let debounceTimer;
function debouncedLoad(){clearTimeout(debounceTimer);debounceTimer=setTimeout(()=>loadLogs(1),350);}

async function loadEntityTypes(){
  try{
    const d=await apiGet('/activity-logs/entity-types');
    if(!d.success)return;
    const sel=document.getElementById('entityFilter');
    d.entity_types.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t.charAt(0).toUpperCase()+t.slice(1);sel.appendChild(o);});
  }catch(e){}
}

function setDateFilter(range){
  const now=new Date();
  const from=new Date();
  if(range==='today') from.setHours(0,0,0,0);
  else if(range==='week') from.setDate(now.getDate()-7);
  else from.setDate(1);
  document.getElementById('fromDate').value=from.toISOString().slice(0,10);
  document.getElementById('toDate').value=now.toISOString().slice(0,10);
  loadLogs(1);
}

async function loadLogs(page=1){
  const search=document.getElementById('searchInput').value.trim();
  const entity=document.getElementById('entityFilter').value;
  const from=document.getElementById('fromDate').value;
  const to=document.getElementById('toDate').value;
  const params=new URLSearchParams({page,limit:30});
  if(search)params.set('search',search);
  if(entity)params.set('entity_type',entity);
  if(from)params.set('from',from);
  if(to)params.set('to',to);

  document.getElementById('logsContainer').innerHTML='<div class="empty-state"><p>Loading...</p></div>';
  try{
    const d=await apiGet('/activity-logs?'+params.toString());
    if(!d.success){showToast('Failed to load logs','error');return;}
    renderLogs(d.data.logs);
    renderPagination('logsPagination',d.data.pagination,loadLogs);
  }catch(e){showToast('Error','error');}
}

const ACTION_COLORS = {
  USER_CREATED:'#16a34a',USER_UPDATED:'#2563eb',USER_STATUS_CHANGED:'#d97706',
  ROLE_CHANGED:'#7c3aed',PASSWORD_RESET:'#d97706',
  VENDOR_CREATED:'#16a34a',VENDOR_UPDATED:'#2563eb',VENDOR_DELETED:'#dc2626',VENDOR_STATUS_CHANGED:'#d97706',
  SETTINGS_UPDATED:'#2563eb',
};

function renderLogs(logs){
  const el=document.getElementById('logsContainer');
  if(!logs.length){
    el.innerHTML='<div class="empty-state"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><h3>No logs found</h3><p>Activity will appear here</p></div>';
    return;
  }
  el.innerHTML=logs.map(l=>`
    <div style="display:grid;grid-template-columns:160px 130px 80px 1fr auto;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--border-2);font-size:12.5px">
      <span style="color:var(--muted)">${formatDateTime(l.created_at)}</span>
      <div>
        <div style="font-size:12px;font-weight:600;color:var(--ink)">${l.user_name||'System'}</div>
        <div style="font-size:11px;color:var(--muted)">${l.user_role||''}</div>
      </div>
      <span style="background:${(ACTION_COLORS[l.action]||'#94a3b8')+'22'};color:${ACTION_COLORS[l.action]||'#64748b'};padding:2px 7px;border-radius:4px;font-size:10.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${l.action}</span>
      <span style="color:var(--ink-3)">${l.description}</span>
      <span style="color:var(--muted);font-size:11px">${l.entity_type||''}</span>
    </div>`).join('');
}
</script>
</body>
</html>
