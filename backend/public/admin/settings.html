<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Settings — VendorBridge Admin</title>
<link rel="stylesheet" href="/admin/admin.css"/>
</head>
<body>
<div class="admin-layout">
  <div id="sidebarMount"></div>
  <div class="main-content">
    <header class="topbar">
      <button class="topbar-btn topbar-hamburger" id="hamburger"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="topbar-title">Settings <span class="topbar-subtitle">System configuration</span></div>
      <div class="topbar-actions">
        <a href="notifications.html" class="topbar-btn" style="position:relative">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="notif-dot" id="notifDot" style="display:none"></span>
        </a>
      </div>
    </header>
    <main class="page-body">
      <div class="page-header">
        <div class="page-header-left"><h1>Settings</h1><p>Manage system-wide configuration</p></div>
      </div>

      <div style="max-width:680px">
        <div class="card">
          <div class="card-header"><div class="card-title">Company Settings</div></div>
          <div class="card-body">
            <div class="alert alert-success" id="settingsSuccess">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
              <span>Settings saved successfully.</span>
            </div>
            <div class="alert alert-error" id="settingsError">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              <span id="settingsErrorMsg"></span>
            </div>
            <div class="form-grid cols-1" style="gap:16px">
              <div class="form-group">
                <label class="form-label">Company Name <span class="req">*</span></label>
                <input class="form-input" id="s_company" placeholder="VendorBridge"/>
              </div>
              <div class="form-group">
                <label class="form-label">Support Email</label>
                <input class="form-input" id="s_email" type="email" placeholder="support@company.com"/>
              </div>
              <div class="form-group">
                <label class="form-label">Default Currency</label>
                <select class="form-select" id="s_currency">
                  <option value="INR">INR — Indian Rupee (₹)</option>
                  <option value="USD">USD — US Dollar ($)</option>
                  <option value="EUR">EUR — Euro (€)</option>
                  <option value="GBP">GBP — British Pound (£)</option>
                  <option value="AED">AED — UAE Dirham</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Tax Percentage (%)</label>
                <input class="form-input" id="s_tax" type="number" min="0" max="100" step="0.01" placeholder="18"/>
                <span class="form-hint">Applied to invoice calculations</span>
              </div>
              <div class="form-group">
                <label class="form-label">Company Logo URL</label>
                <input class="form-input" id="s_logo" placeholder="https://..."/>
                <span class="form-hint">Paste an image URL or upload to a CDN</span>
              </div>
            </div>
          </div>
          <div class="card-footer" style="display:flex;justify-content:flex-end">
            <button class="btn btn-primary" id="saveSettingsBtn" onclick="saveSettings()">
              <div class="btn-spinner"></div>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v14a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              <span class="btn-label">Save Settings</span>
            </button>
          </div>
        </div>

        <!-- Account Security -->
        <div class="card" style="margin-top:20px">
          <div class="card-header"><div class="card-title">Admin Account</div></div>
          <div class="card-body">
            <div id="adminAccountInfo" style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
              <div style="width:48px;height:48px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff" id="profileAvatar">A</div>
              <div>
                <div style="font-size:14px;font-weight:700;color:var(--ink)" id="profileName">Admin</div>
                <div style="font-size:12.5px;color:var(--muted)" id="profileEmail">admin@vendorbridge.com</div>
                <span class="badge badge-admin" style="margin-top:4px">Administrator</span>
              </div>
            </div>
            <a href="/pages/forgot-password.html" class="btn btn-outline" style="width:100%;justify-content:center">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              Change Password
            </a>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="/admin/admin.js"></script>
<script>
fetch('/admin/sidebar.html').then(r=>r.text()).then(h=>{
  document.getElementById('sidebarMount').innerHTML=h;
  initAdminPage('settings');
  loadSettings();
  loadProfile();
});

async function loadSettings(){
  try{
    const d=await apiGet('/settings');
    if(!d.success)return;
    const s=d.settings;
    document.getElementById('s_company').value=s.company_name||'';
    document.getElementById('s_email').value=s.support_email||'';
    document.getElementById('s_currency').value=s.default_currency||'INR';
    document.getElementById('s_tax').value=s.tax_percentage||18;
    document.getElementById('s_logo').value=s.company_logo||'';
  }catch(e){}
}

async function loadProfile(){
  try{
    const token=getToken();
    if(!token)return;
    const res=await fetch('/auth/me',{headers:{'Authorization':'Bearer '+token},credentials:'include'});
    const d=await res.json();
    if(d.success&&d.user){
      document.getElementById('profileName').textContent=d.user.full_name;
      document.getElementById('profileEmail').textContent=d.user.email;
      document.getElementById('profileAvatar').textContent=d.user.full_name.charAt(0).toUpperCase();
      localStorage.setItem('vb_name',d.user.full_name);
      document.getElementById('adminName')&&(document.getElementById('adminName').textContent=d.user.full_name);
      document.getElementById('adminAvatar')&&(document.getElementById('adminAvatar').textContent=d.user.full_name.charAt(0));
    }
  }catch(e){}
}

async function saveSettings(){
  const btn=document.getElementById('saveSettingsBtn');
  const body={
    company_name:document.getElementById('s_company').value.trim(),
    support_email:document.getElementById('s_email').value.trim(),
    default_currency:document.getElementById('s_currency').value,
    tax_percentage:parseFloat(document.getElementById('s_tax').value)||18,
    company_logo:document.getElementById('s_logo').value.trim()||null,
  };
  if(!body.company_name){
    document.getElementById('settingsErrorMsg').textContent='Company name is required.';
    document.getElementById('settingsError').classList.add('show'); return;
  }
  document.getElementById('settingsError').classList.remove('show');
  document.getElementById('settingsSuccess').classList.remove('show');
  setLoading(btn,true);
  try{
    const d=await apiPut('/settings',body);
    if(d.success){
      document.getElementById('settingsSuccess').classList.add('show');
      showToast('Settings saved!','success');
    }else{
      document.getElementById('settingsErrorMsg').textContent=d.message||'Failed.';
      document.getElementById('settingsError').classList.add('show');
    }
  }catch(e){showToast('Error saving settings','error');}
  setLoading(btn,false);
}
</script>
</body>
</html>
