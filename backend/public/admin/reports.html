<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Reports — VendorBridge Admin</title>
<link rel="stylesheet" href="/admin/admin.css"/>
</head>
<body>
<div class="admin-layout">
  <div id="sidebarMount"></div>
  <div class="main-content">
    <header class="topbar">
      <button class="topbar-btn topbar-hamburger" id="hamburger"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="topbar-title">Reports <span class="topbar-subtitle">Generate & export reports</span></div>
      <div class="topbar-actions">
        <a href="notifications.html" class="topbar-btn" style="position:relative">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="notif-dot" id="notifDot" style="display:none"></span>
        </a>
      </div>
    </header>
    <main class="page-body">
      <div class="page-header">
        <div class="page-header-left"><h1>Reports</h1><p>Generate, filter and export procurement data</p></div>
      </div>

      <div class="two-col">
        <!-- Report Generator -->
        <div class="card">
          <div class="card-header"><div class="card-title">Generate Report</div></div>
          <div class="card-body">
            <div class="form-grid cols-1" style="gap:14px">
              <div class="form-group">
                <label class="form-label">Report Type</label>
                <select class="form-select" id="reportType" onchange="onTypeChange()">
                  <option value="users">Users Report</option>
                  <option value="vendors">Vendors Report</option>
                  <option value="rfqs">RFQs Report</option>
                  <option value="purchase_orders">Purchase Orders</option>
                  <option value="invoices">Invoices</option>
                  <option value="approvals">Approvals</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">From Date</label>
                <input type="date" class="form-input" id="fromDate"/>
              </div>
              <div class="form-group">
                <label class="form-label">To Date</label>
                <input type="date" class="form-input" id="toDate"/>
              </div>
              <div class="form-group" id="statusFilterGroup">
                <label class="form-label">Status</label>
                <select class="form-select" id="statusFilter"><option value="">All</option></select>
              </div>
              <div class="form-group" id="roleFilterGroup" style="display:none">
                <label class="form-label">Role</label>
                <select class="form-select" id="roleFilter">
                  <option value="">All Roles</option>
                  <option value="procurement_officer">Procurement Officer</option>
                  <option value="manager">Manager</option>
                  <option value="vendor">Vendor</option>
                </select>
              </div>
              <div style="display:flex;gap:8px;margin-top:4px">
                <button class="btn btn-primary" style="flex:1" onclick="generateReport()">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                  <span class="btn-label">Generate</span>
                </button>
                <button class="btn btn-outline" onclick="exportCSV()" title="Export CSV">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                  CSV
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Summary Card -->
        <div class="card">
          <div class="card-header"><div class="card-title">Procurement Summary</div></div>
          <div class="card-body" id="summaryCard">
            <div class="skeleton" style="height:120px;border-radius:10px"></div>
          </div>
        </div>
      </div>

      <!-- Report Results -->
      <div class="card section-gap" id="reportResultCard" style="margin-top:20px">
        <div class="card-header">
          <div><div class="card-title" id="reportResultTitle">Report Results</div><div class="card-subtitle" id="reportResultCount"></div></div>
          <button class="btn btn-outline btn-sm" onclick="exportCSV()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Export CSV
          </button>
        </div>
        <div class="table-wrap" style="border:none;border-radius:0">
          <div id="reportTableWrap">
            <div class="empty-state">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              <h3>No report generated</h3><p>Select a report type and click Generate</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="/admin/admin.js"></script>
<script>
fetch('/admin/sidebar.html').then(r=>r.text()).then(h=>{
  document.getElementById('sidebarMount').innerHTML=h;
  initAdminPage('reports');
  loadSummary();
  onTypeChange();
});

const STATUS_OPTIONS = {
  users: ['active','inactive','suspended'],
  vendors: ['active','inactive'],
  rfqs: ['draft','active','closed','cancelled'],
  purchase_orders: ['draft','issued','acknowledged','delivered','cancelled'],
  invoices: ['pending','paid','overdue','cancelled'],
  approvals: ['pending','approved','rejected'],
};

function onTypeChange(){
  const type = document.getElementById('reportType').value;
  const statusSel = document.getElementById('statusFilter');
  statusSel.innerHTML = '<option value="">All</option>' +
    (STATUS_OPTIONS[type]||[]).map(s=>`<option value="${s}">${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('');
  document.getElementById('roleFilterGroup').style.display = type==='users'?'block':'none';
}

async function loadSummary(){
  try{
    const d=await apiGet('/reports/summary');
    if(!d.success)return;
    const s=d.summary;
    document.getElementById('summaryCard').innerHTML=`
      <div class="stat-row" style="flex-wrap:wrap;gap:20px">
        <div class="stat-item"><div class="stat-num">${s.total_pos||0}</div><div class="stat-lbl">Total POs</div></div>
        <div class="stat-item"><div class="stat-num">${s.unique_vendors||0}</div><div class="stat-lbl">Unique Vendors</div></div>
        <div class="stat-item"><div class="stat-num">${formatCurrency(s.total_spend)}</div><div class="stat-lbl">Total Spend</div></div>
        <div class="stat-item"><div class="stat-num">${formatCurrency(s.avg_po_value)}</div><div class="stat-lbl">Avg PO Value</div></div>
        <div class="stat-item"><div class="stat-num">${formatCurrency(s.max_po_value)}</div><div class="stat-lbl">Largest PO</div></div>
      </div>`;
  }catch(e){}
}

let lastReportData = [];
async function generateReport(){
  const type   = document.getElementById('reportType').value;
  const from   = document.getElementById('fromDate').value;
  const to     = document.getElementById('toDate').value;
  const status = document.getElementById('statusFilter').value;
  const role   = document.getElementById('roleFilter')?.value||'';
  const params = new URLSearchParams({format:'json'});
  if(from) params.set('from', from);
  if(to)   params.set('to', to);
  if(status) params.set('status', status);
  if(role)   params.set('role', role);

  document.getElementById('reportTableWrap').innerHTML='<div style="padding:20px"><div class="skeleton" style="height:200px;border-radius:10px"></div></div>';

  try{
    const d = await apiGet('/reports/'+type+'?'+params.toString());
    if(!d.success){ showToast(d.message||'Failed','error'); return; }
    lastReportData = d.data;
    document.getElementById('reportResultTitle').textContent = type.replace('_',' ').toUpperCase() + ' Report';
    document.getElementById('reportResultCount').textContent = d.total + ' records';
    renderReportTable(type, d.data);
  }catch(e){ showToast('Error generating report','error'); }
}

function renderReportTable(type, data){
  const wrap = document.getElementById('reportTableWrap');
  if(!data.length){
    wrap.innerHTML='<div class="empty-state"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg><h3>No records found</h3><p>Try adjusting your filters</p></div>';
    return;
  }
  const cols = Object.keys(data[0]).filter(k=>!['id','password_hash'].includes(k));
  wrap.innerHTML = `<table id="reportTable">
    <thead><tr>${cols.map(c=>`<th>${c.replace(/_/g,' ').toUpperCase()}</th>`).join('')}</tr></thead>
    <tbody>${data.slice(0,200).map(row=>`<tr>${cols.map(c=>{
      const v=row[c];
      if(v==null)return'<td class="td-muted">—</td>';
      if(c==='role')return`<td>${roleBadge(v)}</td>`;
      if(c==='status')return`<td>${statusBadge(v)}</td>`;
      if(c.includes('_at')||c.includes('date'))return`<td class="td-muted">${formatDate(v)}</td>`;
      if(c.includes('amount')||c.includes('spend'))return`<td style="font-weight:600">${formatCurrency(v)}</td>`;
      return`<td>${v}</td>`;
    }).join('')}</tr>`).join('')}</tbody>
  </table>`;
}

async function exportCSV(){
  const type   = document.getElementById('reportType').value;
  const from   = document.getElementById('fromDate').value;
  const to     = document.getElementById('toDate').value;
  const status = document.getElementById('statusFilter').value;
  const params = new URLSearchParams({format:'csv'});
  if(from) params.set('from', from);
  if(to)   params.set('to', to);
  if(status) params.set('status', status);
  const fname  = `${type}_report_${new Date().toISOString().slice(0,10)}.csv`;
  await downloadCSV('/reports/'+type+'?'+params.toString(), fname);
}
</script>
</body>
</html>
