<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>User Management — VendorBridge Admin</title>
<link rel="stylesheet" href="/admin/admin.css"/>
</head>
<body>
<div class="admin-layout">
  <div id="sidebarMount"></div>
  <div class="main-content">
    <header class="topbar">
      <button class="topbar-btn topbar-hamburger" id="hamburger"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="topbar-title">User Management <span class="topbar-subtitle">Manage all platform users</span></div>
      <div class="topbar-actions">
        <a href="notifications.html" class="topbar-btn" style="position:relative">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="notif-dot" id="notifDot" style="display:none"></span>
        </a>
      </div>
    </header>
    <main class="page-body">
      <div class="page-header">
        <div class="page-header-left"><h1>User Management</h1><p>Create, edit, activate or deactivate user accounts</p></div>
        <div class="page-header-actions">
          <button class="btn btn-primary" onclick="openModal('createUserModal')">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span class="btn-label">Add User</span>
          </button>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="filters-bar" style="margin:0;flex:1">
            <div class="search-wrap">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input class="search-input" id="searchInput" placeholder="Search by name, email or company..." oninput="debouncedLoad()"/>
            </div>
            <select class="filter-select" id="roleFilter" onchange="loadUsers(1)">
              <option value="">All Roles</option>
              <option value="procurement_officer">Procurement Officer</option>
              <option value="manager">Manager</option>
              <option value="vendor">Vendor</option>
            </select>
            <select class="filter-select" id="statusFilter" onchange="loadUsers(1)">
              <option value="">All Status</option>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
              <option value="suspended">Suspended</option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table id="usersTable">
            <thead><tr>
              <th>Name</th><th>Email</th><th>Role</th>
              <th>Verified</th><th>Status</th><th>Joined</th><th>Actions</th>
            </tr></thead>
            <tbody id="usersBody">
              <tr><td colspan="7"><div class="empty-state"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><p>Loading users...</p></div></td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="usersPagination"></div>
      </div>
    </main>
  </div>
</div>

<!-- Create User Modal -->
<div class="modal-overlay" id="createUserModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Create New User</span>
      <button class="modal-close" onclick="closeModal('createUserModal')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="alert alert-error" id="createAlert"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span id="createAlertMsg"></span></div>
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Full Name <span class="req">*</span></label><input class="form-input" id="cu_name" placeholder="John Smith"/></div>
        <div class="form-group"><label class="form-label">Company Name <span class="req">*</span></label><input class="form-input" id="cu_company" placeholder="Acme Corp"/></div>
        <div class="form-group full"><label class="form-label">Email <span class="req">*</span></label><input class="form-input" id="cu_email" type="email" placeholder="john@company.com"/></div>
        <div class="form-group full"><label class="form-label">Role <span class="req">*</span></label>
          <select class="form-select" id="cu_role">
            <option value="">Select role...</option>
            <option value="procurement_officer">Procurement Officer</option>
            <option value="manager">Manager</option>
            <option value="vendor">Vendor</option>
          </select>
        </div>
      </div>
      <p style="font-size:12px;color:var(--muted);margin-top:12px">A temporary password will be generated and emailed to the user.</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('createUserModal')">Cancel</button>
      <button class="btn btn-primary" id="createUserBtn" onclick="createUser()">
        <div class="btn-spinner"></div><span class="btn-label">Create User</span>
      </button>
    </div>
  </div>
</div>

<!-- Edit User Modal -->
<div class="modal-overlay" id="editUserModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Edit User</span>
      <button class="modal-close" onclick="closeModal('editUserModal')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="alert alert-error" id="editAlert"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span id="editAlertMsg"></span></div>
      <input type="hidden" id="eu_id"/>
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Full Name</label><input class="form-input" id="eu_name"/></div>
        <div class="form-group"><label class="form-label">Company Name</label><input class="form-input" id="eu_company"/></div>
        <div class="form-group full"><label class="form-label">Role</label>
          <select class="form-select" id="eu_role">
            <option value="procurement_officer">Procurement Officer</option>
            <option value="manager">Manager</option>
            <option value="vendor">Vendor</option>
          </select>
        </div>
        <div class="form-group full"><label class="form-label">Status</label>
          <select class="form-select" id="eu_status">
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
            <option value="suspended">Suspended</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('editUserModal')">Cancel</button>
      <button class="btn btn-primary" id="editUserBtn" onclick="saveUser()">
        <div class="btn-spinner"></div><span class="btn-label">Save Changes</span>
      </button>
    </div>
  </div>
</div>

<script src="/admin/admin.js"></script>
<script>
fetch('/admin/sidebar.html').then(r=>r.text()).then(h=>{
  document.getElementById('sidebarMount').innerHTML=h;
  initAdminPage('users');
  loadUsers(1);
});

let currentPage = 1;
let debounceTimer;
function debouncedLoad() { clearTimeout(debounceTimer); debounceTimer = setTimeout(function() { loadUsers(1); }, 350); }

function loadUsers(page) {
  if (!page) page = 1;
  currentPage = page;
  const search   = document.getElementById('searchInput').value.trim();
  const role     = document.getElementById('roleFilter').value;
  const status   = document.getElementById('statusFilter').value;
  const params   = new URLSearchParams({ page: page, limit: 15 });
  if (search) params.set('search', search);
  if (role)   params.set('role', role);
  if (status) params.set('status', status);

  document.getElementById('usersBody').innerHTML =
    '<tr><td colspan="7"><div class="empty-state"><div class="skeleton" style="height:16px;width:200px;margin:0 auto"></div></div></td></tr>';

  apiGet('/users?' + params.toString())
    .then(function(d) {
      if (!d.success) { showToast('Failed to load users', 'error'); return; }
      renderUsers(d.data.users);
      renderPagination('usersPagination', d.data.pagination, loadUsers);
    })
    .catch(function(e) { showToast('Error loading users', 'error'); });
}

function renderUsers(users) {
  const tbody = document.getElementById('usersBody');
  if (!users.length) {
    tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><h3>No users found</h3><p>Try adjusting your search or filters</p></div></td></tr>';
    return;
  }
  tbody.innerHTML = users.map(u => `
    <tr>
      <td><div class="td-name">${u.full_name}</div><div class="td-muted">${u.company_name}</div></td>
      <td>${u.email}</td>
      <td>${roleBadge(u.role)}</td>
      <td>${verifiedBadge(u.is_verified)}</td>
      <td>${statusBadge(u.status)}</td>
      <td class="td-muted">${formatDate(u.created_at)}</td>
      <td>
        <div class="td-actions">
          <button class="btn btn-ghost btn-sm btn-icon" title="Edit" onclick='openEditUser(${JSON.stringify(u)})'>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="btn btn-ghost btn-sm btn-icon" title="Reset Password" onclick="resetUserPw('${u.id}','${u.full_name}')">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </button>
          <button class="btn btn-sm btn-icon ${u.status==='active'?'btn-danger':'btn-success'}" title="${u.status==='active'?'Deactivate':'Activate'}"
            onclick="toggleUserStatus('${u.id}','${u.status==='active'?'inactive':'active'}','${u.full_name}')">
            ${u.status==='active'
              ? '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="8" y1="8" x2="16" y2="16"/></svg>'
              : '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>'}
          </button>
        </div>
      </td>
    </tr>`).join('');
}

async function createUser() {
  const btn = document.getElementById('createUserBtn');
  const name = document.getElementById('cu_name').value.trim();
  const company = document.getElementById('cu_company').value.trim();
  const email = document.getElementById('cu_email').value.trim();
  const role = document.getElementById('cu_role').value;
  const alertEl = document.getElementById('createAlert');
  alertEl.classList.remove('show');

  if (!name||!company||!email||!role) {
    document.getElementById('createAlertMsg').textContent='All fields are required.';
    alertEl.classList.add('show'); return;
  }

  setLoading(btn, true);
  apiPost('/users', { full_name:name, company_name:company, email, role })
    .then(function(d) {
      if (!d.success) {
        document.getElementById('createAlertMsg').textContent = d.message || 'Failed to create user.';
        alertEl.classList.add('show');
        setLoading(btn, false);
      } else {
        closeModal('createUserModal');
        showToast('User created successfully!', 'success');
        document.getElementById('cu_name').value=''; document.getElementById('cu_company').value='';
        document.getElementById('cu_email').value=''; document.getElementById('cu_role').value='';
        setLoading(btn, false);
        loadUsers(1);
      }
    })
    .catch(function(e) { showToast('Network error', 'error'); setLoading(btn, false); });
}

function openEditUser(u) {
  document.getElementById('eu_id').value = u.id;
  document.getElementById('eu_name').value = u.full_name;
  document.getElementById('eu_company').value = u.company_name;
  document.getElementById('eu_role').value = u.role;
  document.getElementById('eu_status').value = u.status;
  document.getElementById('editAlert').classList.remove('show');
  openModal('editUserModal');
}

function saveUser() {
  const btn = document.getElementById('editUserBtn');
  const id = document.getElementById('eu_id').value;
  const full_name = document.getElementById('eu_name').value.trim();
  const company_name = document.getElementById('eu_company').value.trim();
  const role = document.getElementById('eu_role').value;
  const status = document.getElementById('eu_status').value;
  setLoading(btn, true);
  
  Promise.all([
    apiPut('/users/' + id, { full_name: full_name, company_name: company_name }),
    apiPatch('/users/' + id + '/role', { role: role }),
  ]).then(function() {
    return apiPatch('/users/' + id + '/status', { status: status });
  }).then(function() {
    closeModal('editUserModal');
    showToast('User updated!', 'success');
    setLoading(btn, false);
    loadUsers(currentPage);
  }).catch(function(e) { 
    showToast('Failed to update user', 'error'); 
    setLoading(btn, false);
  });
}

function toggleUserStatus(id, newStatus, name) {
  var title = newStatus === 'inactive' ? 'Deactivate User' : 'Activate User';
  var msg = 'Are you sure you want to ' + (newStatus === 'inactive' ? 'deactivate' : 'activate') + ' <strong>' + name + '</strong>?';
  var confirmText = newStatus === 'inactive' ? 'Deactivate' : 'Activate';
  var type = newStatus === 'inactive' ? 'danger' : 'success';
  
  showConfirm({ title: title, message: msg, confirmText: confirmText, type: type })
    .then(function(ok) {
      if (!ok) return;
      apiPatch('/users/' + id + '/status', { status: newStatus })
        .then(function(d) {
          if (d.success) { showToast('User ' + newStatus + '!', 'success'); loadUsers(currentPage); }
          else showToast(d.message || 'Failed', 'error');
        })
        .catch(function(e) { showToast('Error', 'error'); });
    });
}

function resetUserPw(id, name) {
  showConfirm({ title: 'Reset Password', message: 'Send a new temporary password to <strong>' + name + '</strong>?', confirmText: 'Reset & Send', type: 'warning' })
    .then(function(ok) {
      if (!ok) return;
      apiPost('/users/' + id + '/reset-password', {})
        .then(function(d) {
          if (d.success) showToast('Password reset and emailed!', 'success');
          else showToast(d.message || 'Failed', 'error');
        })
        .catch(function(e) { showToast('Error', 'error'); });
    });
}
</script>
</body>
</html>
