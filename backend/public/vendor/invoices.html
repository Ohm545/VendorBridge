<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Invoices — VendorBridge Vendor</title><link rel="stylesheet" href="/vendor/vendor.css"/></head>
<body><div class="admin-layout"><div id="sidebarMount"></div><div class="main-content">
<header class="topbar"><button class="topbar-btn topbar-hamburger" id="hamburger"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
<div class="topbar-title">Invoices <span class="topbar-subtitle">All invoices for your POs</span></div>
<div class="topbar-actions"><a href="/vendor/notifications" class="topbar-btn" style="position:relative"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-dot" id="notifDot" style="display:none"></span></a></div></header>
<main class="page-body">
<div class="page-header"><div class="page-header-left"><h1>Invoices</h1><p>All invoices generated for your purchase orders</p></div></div>
<div class="card">
  <div class="card-header"><div class="filters-bar" style="margin:0;flex:1">
    <select class="filter-select" id="statusFilter" onchange="loadInvoices(1)"><option value="">All Status</option><option value="pending">Pending</option><option value="paid">Paid</option><option value="overdue">Overdue</option></select>
  </div></div>
  <div class="table-wrap"><table><thead><tr><th>Invoice #</th><th>PO Number</th><th>RFQ</th><th>Amount</th><th>Tax</th><th>Total</th><th>Status</th><th>Due Date</th><th>Actions</th></tr></thead>
  <tbody id="invBody"></tbody></table></div>
  <div class="pagination" id="invPagination"></div>
</div></main></div></div>

<!-- Invoice Detail Modal -->
<div class="modal-overlay" id="invModal"><div class="modal modal-lg">
  <div class="modal-header"><span class="modal-title" id="invModalTitle">Invoice</span><button class="modal-close" onclick="closeModal('invModal')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div class="modal-body" id="invModalBody">Loading...</div>
  <div class="modal-footer"><button class="btn btn-outline" onclick="closeModal('invModal')">Close</button><button class="btn btn-primary" onclick="window.print()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Print</button></div>
</div></div>

<script src="/vendor/vendor.js"></script>
<script>
fetch('/vendor/sidebar.html').then(r=>r.text()).then(h=>{document.getElementById('sidebarMount').innerHTML=h;initVendorPage('invoices');loadInvoices(1);});
let currentPage=1;
async function loadInvoices(page=1){currentPage=page;const st=document.getElementById('statusFilter').value;const p=new URLSearchParams({page,limit:15});if(st)p.set('status',st);
document.getElementById('invBody').innerHTML='<tr><td colspan="9"><div class="empty-state"><p>Loading...</p></div></td></tr>';
try{const d=await apiGet('/invoices?'+p.toString());if(!d.success)return;renderInvoices(d.data.invoices);renderPagination('invPagination',d.data.pagination,loadInvoices);}catch(e){showToast('Error','error');}}
function renderInvoices(invs){const tbody=document.getElementById('invBody');if(!invs.length){tbody.innerHTML='<tr><td colspan="9"><div class="empty-state"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><h3>No invoices yet</h3><p>Invoices appear after POs are processed</p></div></td></tr>';return;}
tbody.innerHTML=invs.map(i=>`<tr>
  <td><span style="font-weight:700;color:var(--vendor)">${i.invoice_number}</span></td>
  <td style="font-size:13px">${i.po_number||'—'}</td>
  <td style="font-size:13px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i.rfq_title||'—'}</td>
  <td style="font-weight:600">${formatCurrency(i.amount)}</td>
  <td style="color:var(--mid)">${formatCurrency(i.tax_amount)}</td>
  <td><span style="font-size:15px;font-weight:800;color:var(--ink)">${formatCurrency(i.total_amount)}</span></td>
  <td>${statusBadge(i.status)}</td>
  <td class="td-muted" style="${new Date(i.due_date)<new Date()&&i.status==='pending'?'color:var(--red);font-weight:600':''}">${formatDate(i.due_date)}</td>
  <td><button class="btn btn-primary btn-sm" onclick="viewInvoice('${i.id}')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>View</button></td>
</tr>`).join('');}
async function viewInvoice(id){openModal('invModal');document.getElementById('invModalBody').innerHTML='<div class="skeleton" style="height:250px;border-radius:10px"></div>';
try{const d=await apiGet('/invoices/'+id);if(!d.success){document.getElementById('invModalBody').innerHTML='<p>Failed.</p>';return;}
const inv=d.invoice;document.getElementById('invModalTitle').textContent='Invoice: '+inv.invoice_number;
document.getElementById('invModalBody').innerHTML=`
  <div class="detail-header"><div class="detail-header-title">${inv.invoice_number}</div><div class="detail-header-sub">${formatDate(inv.created_at)} · ${statusBadge(inv.status)}</div></div>
  <div class="two-col">
    <div>
      <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px">INVOICE DETAILS</div>
      <div class="detail-row"><span class="detail-row-label">PO Number</span><span class="detail-row-value">${inv.po_number||'—'}</span></div>
      <div class="detail-row"><span class="detail-row-label">RFQ</span><span class="detail-row-value">${inv.rfq_title||'—'}</span></div>
      <div class="detail-row"><span class="detail-row-label">Due Date</span><span class="detail-row-value">${formatDate(inv.due_date)}</span></div>
      <div style="background:var(--surface-2);border-radius:10px;padding:14px 16px;margin-top:14px">
        <div class="detail-row"><span class="detail-row-label">Amount</span><span class="detail-row-value">${formatCurrency(inv.amount)}</span></div>
        <div class="detail-row"><span class="detail-row-label">Tax (${inv.tax_percentage||18}%)</span><span class="detail-row-value">${formatCurrency(inv.tax_amount)}</span></div>
        <div class="detail-row" style="border-top:2px solid var(--border);margin-top:6px;padding-top:10px"><span style="font-size:14px;font-weight:700;color:var(--ink)">Grand Total</span><span style="font-size:18px;font-weight:800;color:var(--vendor)">${formatCurrency(inv.total_amount)}</span></div>
      </div>
    </div>
    <div>
      <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px">VENDOR DETAILS</div>
      <div class="detail-row"><span class="detail-row-label">Company</span><span class="detail-row-value">${inv.company_name||'—'}</span></div>
      <div class="detail-row"><span class="detail-row-label">GST</span><span class="detail-row-value">${inv.gst_number||'—'}</span></div>
      <div class="detail-row"><span class="detail-row-label">Email</span><span class="detail-row-value">${inv.vendor_email||'—'}</span></div>
      ${inv.address?`<div class="detail-row"><span class="detail-row-label">Address</span><span class="detail-row-value">${inv.address}</span></div>`:''}
      ${inv.notes?`<div style="margin-top:12px;padding:10px;background:var(--surface-2);border-radius:8px;font-size:13px;color:var(--mid)"><strong>Notes:</strong> ${inv.notes}</div>`:''}
    </div>
  </div>`;}catch(e){document.getElementById('invModalBody').innerHTML='<p>Error.</p>';}}
</script></body></html>
