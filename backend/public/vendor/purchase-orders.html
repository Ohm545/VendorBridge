<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Purchase Orders — VendorBridge Vendor</title><link rel="stylesheet" href="/vendor/vendor.css"/></head>
<body><div class="admin-layout"><div id="sidebarMount"></div><div class="main-content">
<header class="topbar"><button class="topbar-btn topbar-hamburger" id="hamburger"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
<div class="topbar-title">Purchase Orders <span class="topbar-subtitle">Orders issued to you</span></div>
<div class="topbar-actions"><a href="/vendor/notifications" class="topbar-btn" style="position:relative"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-dot" id="notifDot" style="display:none"></span></a></div></header>
<main class="page-body">
<div class="page-header"><div class="page-header-left"><h1>Purchase Orders</h1><p>Purchase orders issued to you</p></div></div>
<div class="card">
  <div class="card-header"><div class="filters-bar" style="margin:0;flex:1">
    <div class="search-wrap"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input class="search-input" id="searchInput" placeholder="Search PO number or RFQ..." oninput="debouncedLoad()"/></div>
    <select class="filter-select" id="statusFilter" onchange="loadPOs(1)"><option value="">All Status</option><option value="issued">Issued</option><option value="acknowledged">Acknowledged</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select>
  </div></div>
  <div class="table-wrap"><table><thead><tr><th>PO Number</th><th>RFQ</th><th>Amount</th><th>Issued</th><th>Delivery Date</th><th>Status</th><th>Invoice</th><th>Actions</th></tr></thead>
  <tbody id="posBody"></tbody></table></div>
  <div class="pagination" id="posPagination"></div>
</div></main></div></div>

<!-- PO Detail Modal -->
<div class="modal-overlay" id="poModal"><div class="modal modal-lg">
  <div class="modal-header"><span class="modal-title" id="poModalTitle">Purchase Order</span><button class="modal-close" onclick="closeModal('poModal')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div class="modal-body" id="poModalBody">Loading...</div>
  <div class="modal-footer"><button class="btn btn-outline" onclick="closeModal('poModal')">Close</button><button class="btn btn-primary" onclick="printPO()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Print PO</button></div>
</div></div>

<script src="/vendor/vendor.js"></script>
<script>
fetch('/vendor/sidebar.html').then(r=>r.text()).then(h=>{document.getElementById('sidebarMount').innerHTML=h;initVendorPage('purchase-orders');loadPOs(1);});
let debounceTimer,currentPage=1,currentPO=null;
function debouncedLoad(){clearTimeout(debounceTimer);debounceTimer=setTimeout(()=>loadPOs(1),350);}
async function loadPOs(page=1){currentPage=page;const s=document.getElementById('searchInput').value.trim(),st=document.getElementById('statusFilter').value;const p=new URLSearchParams({page,limit:15});if(s)p.set('search',s);if(st)p.set('status',st);
document.getElementById('posBody').innerHTML='<tr><td colspan="8"><div class="empty-state"><p>Loading...</p></div></td></tr>';
try{const d=await apiGet('/purchase-orders?'+p.toString());if(!d.success)return;renderPOs(d.data.purchase_orders);renderPagination('posPagination',d.data.pagination,loadPOs);}catch(e){showToast('Error','error');}}
function renderPOs(pos){const tbody=document.getElementById('posBody');if(!pos.length){tbody.innerHTML='<tr><td colspan="8"><div class="empty-state"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><h3>No purchase orders</h3><p>POs will appear here once generated</p></div></td></tr>';return;}
tbody.innerHTML=pos.map(po=>`<tr>
  <td><span style="font-weight:700;color:var(--vendor)">${po.po_number}</span></td>
  <td><div class="td-name" style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${po.rfq_title||'—'}</div></td>
  <td><span style="font-size:15px;font-weight:800;color:var(--ink)">${formatCurrency(po.amount)}</span></td>
  <td class="td-muted">${formatDate(po.issued_at)}</td>
  <td class="td-muted">${formatDate(po.delivery_date)}</td>
  <td>${statusBadge(po.status)}</td>
  <td style="font-size:12.5px;color:var(--green)">${po.invoice_number||'—'}</td>
  <td><div class="td-actions"><button class="btn btn-primary btn-sm" onclick="viewPO('${po.id}')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>View</button></div></td>
</tr>`).join('');}
async function viewPO(id){openModal('poModal');document.getElementById('poModalBody').innerHTML='<div class="skeleton" style="height:250px;border-radius:10px"></div>';
try{const d=await apiGet('/purchase-orders/'+id);if(!d.success){document.getElementById('poModalBody').innerHTML='<p>Failed.</p>';return;}
const po=d.purchase_order;currentPO=po;
document.getElementById('poModalTitle').textContent='PO: '+po.po_number;
document.getElementById('poModalBody').innerHTML=`
  <div class="detail-header"><div class="detail-header-title">${po.po_number}</div><div class="detail-header-sub">${formatDate(po.issued_at)} · ${statusBadge(po.status)}</div></div>
  <div class="two-col">
    <div>
      <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px">PURCHASE ORDER DETAILS</div>
      <div class="detail-row"><span class="detail-row-label">Amount</span><span class="detail-row-value" style="font-size:18px;color:var(--vendor)">${formatCurrency(po.amount)}</span></div>
      <div class="detail-row"><span class="detail-row-label">RFQ</span><span class="detail-row-value">${po.rfq_title||'—'}</span></div>
      <div class="detail-row"><span class="detail-row-label">Category</span><span class="detail-row-value">${po.product_category||'—'}</span></div>
      <div class="detail-row"><span class="detail-row-label">Quantity</span><span class="detail-row-value">${po.quantity||'—'}</span></div>
      <div class="detail-row"><span class="detail-row-label">Delivery Date</span><span class="detail-row-value">${formatDate(po.delivery_date)}</span></div>
      <div class="detail-row"><span class="detail-row-label">Issued By</span><span class="detail-row-value">${po.issued_by_name||'—'}</span></div>
      <div class="detail-row"><span class="detail-row-label">Approved By</span><span class="detail-row-value">${po.approved_by_name||'—'}</span></div>
    </div>
    <div>
      <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px">VENDOR DETAILS</div>
      <div class="detail-row"><span class="detail-row-label">Vendor</span><span class="detail-row-value">${po.vendor_name||'—'}</span></div>
      <div class="detail-row"><span class="detail-row-label">Company</span><span class="detail-row-value">${po.company_name||'—'}</span></div>
      <div class="detail-row"><span class="detail-row-label">GST</span><span class="detail-row-value">${po.gst_number||'—'}</span></div>
      <div class="detail-row"><span class="detail-row-label">Email</span><span class="detail-row-value">${po.vendor_email||'—'}</span></div>
      ${po.terms?`<div style="margin-top:12px;padding:10px;background:var(--surface-2);border-radius:8px;font-size:13px;color:var(--mid)"><strong>Terms:</strong> ${po.terms}</div>`:''}
    </div>
  </div>`;}catch(e){document.getElementById('poModalBody').innerHTML='<p>Error.</p>';}}
function printPO(){if(!currentPO)return;window.print();}
</script></body></html>
