<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>My Quotations — VendorBridge Vendor</title><link rel="stylesheet" href="/vendor/vendor.css"/></head>
<body><div class="admin-layout"><div id="sidebarMount"></div><div class="main-content">
<header class="topbar"><button class="topbar-btn topbar-hamburger" id="hamburger"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
<div class="topbar-title">My Quotations <span class="topbar-subtitle">All submitted quotations</span></div>
<div class="topbar-actions"><a href="/vendor/notifications" class="topbar-btn" style="position:relative"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-dot" id="notifDot" style="display:none"></span></a></div></header>
<main class="page-body">
<div class="page-header"><div class="page-header-left"><h1>My Quotations</h1><p>Track all your submitted quotations and their outcomes</p></div></div>
<div class="tabs">
  <div class="tab active" onclick="filterStatus('',this)">All</div>
  <div class="tab" onclick="filterStatus('submitted',this)">Submitted</div>
  <div class="tab" onclick="filterStatus('under_review',this)">Under Review</div>
  <div class="tab" onclick="filterStatus('approved',this)">✅ Won</div>
  <div class="tab" onclick="filterStatus('rejected',this)">❌ Lost</div>
</div>
<div class="card">
  <div class="card-header"><div class="filters-bar" style="margin:0;flex:1">
    <div class="search-wrap"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input class="search-input" id="searchInput" placeholder="Search by RFQ..." oninput="debouncedLoad()"/></div>
  </div></div>
  <div class="table-wrap"><table><thead><tr><th>RFQ</th><th>Category</th><th>Quoted Amount</th><th>Delivery Days</th><th>Status</th><th>Submitted</th><th>PO Number</th><th>Invoice</th><th>Actions</th></tr></thead>
  <tbody id="quotesBody"></tbody></table></div>
  <div class="pagination" id="quotesPagination"></div>
</div></main></div></div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal"><div class="modal">
  <div class="modal-header"><span class="modal-title">Edit Quotation</span><button class="modal-close" onclick="closeModal('editModal')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div class="modal-body">
    <div class="alert alert-error" id="editAlert"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg><span id="editAlertMsg"></span></div>
    <input type="hidden" id="edit_id"/>
    <div class="form-grid">
      <div class="form-group"><label class="form-label">Quoted Amount (₹) *</label><input class="form-input" id="edit_amount" type="number"/></div>
      <div class="form-group"><label class="form-label">Delivery Days *</label><input class="form-input" id="edit_days" type="number"/></div>
      <div class="form-group full"><label class="form-label">Remarks</label><textarea class="form-textarea" id="edit_remarks"></textarea></div>
    </div>
  </div>
  <div class="modal-footer"><button class="btn btn-outline" onclick="closeModal('editModal')">Cancel</button><button class="btn btn-primary" id="saveEditBtn" onclick="saveEdit()"><div class="btn-spinner"></div><span class="btn-label">Update</span></button></div>
</div></div>

<script src="/vendor/vendor.js"></script>
<script>
fetch('/vendor/sidebar.html').then(r=>r.text()).then(h=>{document.getElementById('sidebarMount').innerHTML=h;initVendorPage('quotations');loadQuotations(1);});
let debounceTimer,currentPage=1,currentStatus='';
function debouncedLoad(){clearTimeout(debounceTimer);debounceTimer=setTimeout(()=>loadQuotations(1),350);}
function filterStatus(s,el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');currentStatus=s;loadQuotations(1);}
async function loadQuotations(page=1){currentPage=page;const s=document.getElementById('searchInput').value.trim();const p=new URLSearchParams({page,limit:15});if(currentStatus)p.set('status',currentStatus);if(s)p.set('search',s);
document.getElementById('quotesBody').innerHTML='<tr><td colspan="9"><div class="empty-state"><p>Loading...</p></div></td></tr>';
try{const d=await apiGet('/quotations?'+p.toString());if(!d.success)return;renderQuotes(d.data.quotations);renderPagination('quotesPagination',d.data.pagination,loadQuotations);}catch(e){showToast('Error','error');}}
function renderQuotes(quotes){const tbody=document.getElementById('quotesBody');if(!quotes.length){tbody.innerHTML='<tr><td colspan="9"><div class="empty-state"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><h3>No quotations yet</h3><p>Submit quotations from the Assigned RFQs page</p></div></td></tr>';return;}
tbody.innerHTML=quotes.map(q=>`<tr>
  <td><div class="td-name">${q.rfq_title}</div><div class="td-muted">${q.product_category||''}</div></td>
  <td>${q.product_category?`<span class="badge badge-info">${q.product_category}</span>`:'—'}</td>
  <td><div style="font-size:15px;font-weight:800;color:var(--ink)">${formatCurrency(q.quoted_amount)}</div></td>
  <td style="font-size:13px">${q.delivery_days} days</td>
  <td>${statusBadge(q.status)}</td>
  <td class="td-muted">${formatDate(q.submitted_at)}</td>
  <td style="font-size:13px;font-weight:600;color:var(--green)">${q.po_number||'—'}</td>
  <td style="font-size:13px;color:var(--vendor)">${q.invoice_number||'—'}</td>
  <td><div class="td-actions">
    ${['submitted','under_review'].includes(q.status)&&new Date(q.deadline)>new Date()?
      `<button class="btn btn-outline btn-sm" onclick="openEdit('${q.id}',${q.quoted_amount||0},${q.delivery_days||0},'${(q.remarks||'').replace(/'/g,"\\'")}')">Edit</button>`:''}
  </div></td>
</tr>`).join('');}
function openEdit(id,amount,days,remarks){document.getElementById('edit_id').value=id;document.getElementById('edit_amount').value=amount;document.getElementById('edit_days').value=days;document.getElementById('edit_remarks').value=remarks;document.getElementById('editAlert').classList.remove('show');openModal('editModal');}
async function saveEdit(){const id=document.getElementById('edit_id').value,amount=document.getElementById('edit_amount').value,days=document.getElementById('edit_days').value,remarks=document.getElementById('edit_remarks').value.trim();
if(!amount||!days){document.getElementById('editAlertMsg').textContent='Amount and days required.';document.getElementById('editAlert').classList.add('show');return;}
const btn=document.getElementById('saveEditBtn');setLoading(btn,true);
try{const d=await apiPut('/quotations/'+id,{quoted_amount:parseFloat(amount),delivery_days:parseInt(days),remarks});if(d.success){closeModal('editModal');showToast('Quotation updated!','success');loadQuotations(currentPage);}else{document.getElementById('editAlertMsg').textContent=d.message||'Failed.';document.getElementById('editAlert').classList.add('show');}}catch(e){showToast('Error','error');}setLoading(btn,false);}
</script></body></html>
