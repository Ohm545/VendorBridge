<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Notifications — VendorBridge Vendor</title><link rel="stylesheet" href="/vendor/vendor.css"/></head>
<body><div class="admin-layout"><div id="sidebarMount"></div><div class="main-content">
<header class="topbar"><button class="topbar-btn topbar-hamburger" id="hamburger"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
<div class="topbar-title">Notifications <span class="topbar-subtitle" id="unreadLabel"></span></div>
<div class="topbar-actions"><button class="topbar-btn" onclick="markAllRead()" title="Mark all read"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></button></div></header>
<main class="page-body">
<div class="page-header"><div class="page-header-left"><h1>Notifications</h1><p>RFQ assignments, approval updates and order notifications</p></div>
<div class="page-header-actions">
  <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--mid);cursor:pointer"><input type="checkbox" id="unreadOnly" onchange="loadNotifs(1)" style="width:14px;height:14px;accent-color:var(--vendor)"/>Unread only</label>
  <button class="btn btn-outline btn-sm" onclick="markAllRead()">Mark all read</button>
</div></div>
<div class="card"><div id="notifList"><div class="empty-state"><p>Loading...</p></div></div><div class="pagination" id="notifPagination"></div></div>
</main></div></div>
<script src="/vendor/vendor.js"></script>
<script>
fetch('/vendor/sidebar.html').then(r=>r.text()).then(h=>{document.getElementById('sidebarMount').innerHTML=h;initVendorPage('notifications');loadNotifs(1);});
const NC={info:'var(--accent)',success:'var(--green)',warning:'var(--orange)',error:'var(--red)'};
const NI={info:'<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>',success:'<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',warning:'<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/>',error:'<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>'};
async function loadNotifs(page=1){const unreadOnly=document.getElementById('unreadOnly').checked;const p=new URLSearchParams({page,limit:20});if(unreadOnly)p.set('unread','true');
try{const d=await apiGet('/notifications?'+p.toString());if(!d.success)return;document.getElementById('unreadLabel').textContent=d.data.unread_count>0?d.data.unread_count+' unread':'All read';renderNotifs(d.data.notifications);renderPagination('notifPagination',d.data.pagination,loadNotifs);updateNotifBadge();}catch(e){showToast('Error','error');}}
function renderNotifs(notifs){const el=document.getElementById('notifList');if(!notifs.length){el.innerHTML='<div class="empty-state"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><h3>No notifications</h3><p>You\'re all caught up!</p></div>';return;}
el.innerHTML=notifs.map(n=>`<div style="display:flex;gap:12px;padding:14px 16px;cursor:pointer;transition:background .15s;border-bottom:1px solid var(--border-2);${!n.is_read?'background:var(--vendor-l)':''}" onclick="markOne('${n.id}',this)">
  <div style="width:34px;height:34px;border-radius:9px;background:${(NC[n.type]||'var(--accent)')+'20'};display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="${NC[n.type]||'var(--accent)'}" stroke-width="2" width="16" height="16">${NI[n.type]||NI.info}</svg></div>
  <div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:${n.is_read?'500':'700'};color:var(--ink);margin-bottom:3px">${n.title}</div><div style="font-size:12.5px;color:var(--mid);line-height:1.5">${n.message}</div></div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0"><span style="font-size:11.5px;color:var(--muted)">${timeAgo(n.created_at)}</span>${!n.is_read?'<div style="width:8px;height:8px;border-radius:50%;background:var(--vendor)"></div>':''}</div>
</div>`).join('');}
async function markOne(id,el){if(!el.style.background)return;try{await apiPatch('/notifications/mark-read',{ids:[id]});el.style.background='';updateNotifBadge();}catch(e){}}
async function markAllRead(){try{await apiPatch('/notifications/mark-read',{ids:[]});showToast('All marked as read','success');loadNotifs(1);}catch(e){showToast('Error','error');}}
</script></body></html>
