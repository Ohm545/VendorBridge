<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Invoices — VendorBridge Procurement</title>
<link rel="stylesheet" href="/procurement/procurement.css"/></head>
<body>
<div class="admin-layout">
  <div id="sidebarMount"></div>
  <div class="main-content">
    <header class="topbar">
      <button class="topbar-btn topbar-hamburger" id="hamburger"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="topbar-title">Invoices <span class="topbar-subtitle">View and manage invoices</span></div>
      <div class="topbar-actions">
        <button class="btn btn-outline btn-sm" onclick="downloadCSV('/reports/invoices?format=csv','invoices_report.csv')">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export
        </button>
        <a href="notifications.html" class="topbar-btn" style="position:relative"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-dot" id="notifDot" style="display:none"></span></a>
      </div>
    </header>
    <main class="page-body">
      <div class="page-header">
        <div class="page-header-left"><h1>Invoices</h1><p>All generated invoices for your purchase orders</p></div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="filters-bar" style="margin:0;flex:1">
            <div class="search-wrap"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input class="search-input" id="searchInput" placeholder="Search invoice or vendor..." oninput="debouncedLoad()"/></div>
            <select class="filter-select" id="statusFilter" onchange="loadInvoices(1)">
              <option value="">All Status</option>
              <option value="pending">Pending</option><option value="paid">Paid</option>
              <option value="overdue">Overdue</option><option value="cancelled">Cancelled</option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table><thead><tr><th>Invoice #</th><th>PO Number</th><th>Vendor</th><th>Amount</th><th>Tax</th><th>Total</th><th>Status</th><th>Due Date</th><th>Actions</th></tr></thead>
          <tbody id="invoicesBody"></tbody></table>
        </div>
        <div class="pagination" id="invoicesPagination"></div>
      </div>
    </main>
  </div>
</div>

<!-- Invoice Detail Modal -->
<div class="modal-overlay" id="invDetailModal">
  <div class="modal modal-lg">
    <div class="modal-header"><span class="modal-title">Invoice Details</span><button class="modal-close" onclick="closeModal('invDetailModal')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="modal-body" id="invDetailBody">Loading...</div>
    <div class="modal-footer"><button class="btn btn-outline" onclick="closeModal('invDetailModal')">Close</button></div>
  </div>
</div>

<script src="/procurement/procurement.js"></script>
<script>
fetch('/procurement/sidebar.html').then(r=>r.text()).then(h=>{document.getElementById('sidebarMount').innerHTML=h;initProcurementPage('invoices');loadInvoices(1);});
let debounceTimer,currentPage=1;
function debouncedLoad(){clearTimeout(debounceTimer);debounceTimer=setTimeout(()=>loadInvoices(1),350);}

async function loadInvoices(page=1){
  currentPage=page;
  const search=document.getElementById('searchInput').value.trim();
  const status=document.getElementById('statusFilter').value;
  const params=new URLSearchParams({page,limit:15});
  if(search)params.set('search',search);if(status)params.set('status',status);
  document.getElementById('invoicesBody').innerHTML='<tr><td colspan="9"><div class="empty-state"><p>Loading...</p></div></td></tr>';
  try{
    const d=await apiGet('/invoices?'+params.toString()); if(!d.success)return;
    renderInvoices(d.data.invoices);
    renderPagination('invoicesPagination',d.data.pagination,loadInvoices);
  }catch(e){showToast('Error','error');}
}

function renderInvoices(invoices){
  const tbody=document.getElementById('invoicesBody');
  if(!invoices.length){tbody.innerHTML='<tr><td colspan="9"><div class="empty-state"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><h3>No invoices</h3><p>Invoices are generated from purchase orders</p></div></td></tr>';return;}
  tbody.innerHTML=invoices.map(inv=>`<tr>
    <td><span style="font-weight:700;color:var(--accent)">${inv.invoice_number}</span></td>
    <td style="font-size:13px">${inv.po_number||'—'}</td>
    <td><div class="td-name">${inv.vendor_name||'—'}</div></td>
    <td style="font-size:13px">${formatCurrency(inv.amount)}</td>
    <td style="font-size:13px;color:var(--mid)">${formatCurrency(inv.tax_amount)}</td>
    <td style="font-weight:700;font-size:14px">${formatCurrency(inv.total_amount)}</td>
    <td>${statusBadge(inv.status)}</td>
    <td class="td-muted">${formatDate(inv.due_date)}</td>
    <td><div class="td-actions">
      <button class="btn btn-ghost btn-sm btn-icon" title="View Details" onclick="viewInvoice('${inv.id}')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div></td>
  </tr>`).join('');
}

async function viewInvoice(id){
  openModal('invDetailModal');
  document.getElementById('invDetailBody').innerHTML='<div class="skeleton" style="height:200px;border-radius:10px"></div>';
  try{
    const d=await apiGet('/invoices/'+id); if(!d.success){document.getElementById('invDetailBody').innerHTML='<p>Failed.</p>';return;}
    const inv=d.invoice;
    document.getElementById('invDetailBody').innerHTML=`
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border)">
        <div><h2 style="font-size:20px;font-weight:800;color:var(--ink);margin-bottom:4px">${inv.invoice_number}</h2><div style="font-size:13px;color:var(--muted)">PO: ${inv.po_number||'—'} · ${inv.rfq_title||''}</div></div>
        ${statusBadge(inv.status)}
      </div>
      <div class="two-col" style="margin-bottom:20px">
        <div><div style="font-size:12px;color:var(--muted);margin-bottom:4px">VENDOR</div><div style="font-weight:600;color:var(--ink)">${inv.vendor_name||'—'}</div><div style="font-size:12px;color:var(--mid)">${inv.contact_person||''}</div></div>
        <div><div style="font-size:12px;color:var(--muted);margin-bottom:4px">DUE DATE</div><div style="font-weight:600;color:var(--ink)">${formatDate(inv.due_date)}</div></div>
      </div>
      <div style="background:var(--surface-2);border-radius:var(--radius);padding:16px 20px">
        <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);padding:6px 0;border-bottom:1px solid var(--border-2)"><span>Amount</span><span>${formatCurrency(inv.amount)}</span></div>
        <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);padding:6px 0;border-bottom:1px solid var(--border-2)"><span>Tax (${inv.tax_percentage||18}%)</span><span>${formatCurrency(inv.tax_amount)}</span></div>
        <div style="display:flex;justify-content:space-between;font-size:15px;font-weight:800;color:var(--ink);padding:10px 0 0"><span>Grand Total</span><span>${formatCurrency(inv.total_amount)}</span></div>
      </div>
      ${inv.notes?`<div style="margin-top:14px;font-size:13px;color:var(--mid)"><strong>Notes:</strong> ${inv.notes}</div>`:''}`;
  }catch(e){document.getElementById('invDetailBody').innerHTML='<p>Error loading invoice.</p>';}
}
</script>
</body></html>
