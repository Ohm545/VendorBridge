<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Approvals — VendorBridge Procurement</title>
<link rel="stylesheet" href="/procurement/procurement.css"/></head>
<body>
<div class="admin-layout">
  <div id="sidebarMount"></div>
  <div class="main-content">
    <header class="topbar">
      <button class="topbar-btn topbar-hamburger" id="hamburger"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="topbar-title">Approval Requests <span class="topbar-subtitle">Track your approval submissions</span></div>
      <div class="topbar-actions"><a href="notifications.html" class="topbar-btn" style="position:relative"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-dot" id="notifDot" style="display:none"></span></a></div>
    </header>
    <main class="page-body">
      <div class="page-header">
        <div class="page-header-left"><h1>Approval Requests</h1><p>Monitor approval status for your procurement requests</p></div>
      </div>

      <!-- Status filter tabs -->
      <div class="tabs">
        <div class="tab active" onclick="filterByStatus('',this)">All</div>
        <div class="tab" onclick="filterByStatus('pending',this)">Pending</div>
        <div class="tab" onclick="filterByStatus('approved',this)">Approved</div>
        <div class="tab" onclick="filterByStatus('rejected',this)">Rejected</div>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table><thead><tr><th>RFQ</th><th>Preferred Vendor</th><th>Manager</th><th>Status</th><th>Requested</th><th>Resolved</th><th>Notes</th><th>Action</th></tr></thead>
          <tbody id="approvalsBody"><tr><td colspan="8"><div class="empty-state"><p>Loading...</p></div></td></tr></tbody></table>
        </div>
        <div class="pagination" id="approvalsPagination"></div>
      </div>
    </main>
  </div>
</div>
<script src="/procurement/procurement.js"></script>
<script>
fetch('/procurement/sidebar.html').then(r=>r.text()).then(h=>{document.getElementById('sidebarMount').innerHTML=h;initProcurementPage('approvals');loadApprovals(1);});

let currentPage=1,currentStatus='';

function filterByStatus(status,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');
  currentStatus=status;loadApprovals(1);
}

async function loadApprovals(page=1){
  currentPage=page;
  const params=new URLSearchParams({page,limit:15});
  if(currentStatus)params.set('status',currentStatus);
  document.getElementById('approvalsBody').innerHTML='<tr><td colspan="8"><div class="empty-state"><p>Loading...</p></div></td></tr>';
  try{
    const d=await apiGet('/approvals?'+params.toString()); if(!d.success){showToast('Failed','error');return;}
    renderApprovals(d.data.approvals);
    renderPagination('approvalsPagination',d.data.pagination,loadApprovals);
  }catch(e){showToast('Error','error');}
}

function renderApprovals(approvals){
  const tbody=document.getElementById('approvalsBody');
  if(!approvals.length){tbody.innerHTML='<tr><td colspan="8"><div class="empty-state"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><h3>No approval requests</h3><p>Submit a quotation comparison to request approval</p></div></td></tr>';return;}
  tbody.innerHTML=approvals.map(a=>`<tr>
    <td><div class="td-name">${a.rfq_title}</div><div class="td-muted">${a.product_category||''}</div></td>
    <td style="font-size:13px;font-weight:600;color:var(--ink)">${a.preferred_vendor_name||'—'}</td>
    <td><div style="font-size:13px">${a.manager_name||'Unassigned'}</div><div class="td-muted">${a.manager_email||''}</div></td>
    <td>${statusBadge(a.status)}</td>
    <td class="td-muted">${formatDate(a.requested_at)}</td>
    <td class="td-muted">${a.resolved_at?formatDate(a.resolved_at):'—'}</td>
    <td style="font-size:12.5px;color:var(--mid);max-width:150px;overflow:hidden;text-overflow:ellipsis">${a.notes||'—'}</td>
    <td>
      ${a.status==='approved'?`<a href="purchase-orders.html" class="btn btn-success btn-sm"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg> Gen PO</a>`:''}
      ${a.status==='pending'?`<span class="badge badge-pending">Waiting...</span>`:''}
      ${a.status==='rejected'?`<a href="quotations.html?rfq=${a.rfq_id}" class="btn btn-outline btn-sm">Resubmit</a>`:''}
    </td>
  </tr>`).join('');
}
</script>
</body></html>
