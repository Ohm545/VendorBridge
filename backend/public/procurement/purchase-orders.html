<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Purchase Orders — VendorBridge Procurement</title>
<link rel="stylesheet" href="/procurement/procurement.css"/></head>
<body>
<div class="admin-layout">
  <div id="sidebarMount"></div>
  <div class="main-content">
    <header class="topbar">
      <button class="topbar-btn topbar-hamburger" id="hamburger"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="topbar-title">Purchase Orders <span class="topbar-subtitle">Manage generated POs</span></div>
      <div class="topbar-actions"><a href="notifications.html" class="topbar-btn" style="position:relative"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-dot" id="notifDot" style="display:none"></span></a></div>
    </header>
    <main class="page-body">
      <div class="page-header">
        <div class="page-header-left"><h1>Purchase Orders</h1><p>All generated purchase orders</p></div>
        <div class="page-header-actions">
          <button class="btn btn-outline" onclick="downloadCSV('/reports/purchase_orders?format=csv','po_report.csv')">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Export CSV
          </button>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="filters-bar" style="margin:0;flex:1">
            <div class="search-wrap"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input class="search-input" id="searchInput" placeholder="Search PO number or vendor..." oninput="debouncedLoad()"/></div>
            <select class="filter-select" id="statusFilter" onchange="loadPOs(1)">
              <option value="">All Status</option>
              <option value="issued">Issued</option><option value="acknowledged">Acknowledged</option>
              <option value="delivered">Delivered</option><option value="cancelled">Cancelled</option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table><thead><tr><th>PO Number</th><th>Vendor</th><th>RFQ</th><th>Amount</th><th>Issue Date</th><th>Delivery Date</th><th>Status</th><th>Invoice</th><th>Actions</th></tr></thead>
          <tbody id="posBody"></tbody></table>
        </div>
        <div class="pagination" id="posPagination"></div>
      </div>
    </main>
  </div>
</div>

<!-- Generate Invoice Modal -->
<div class="modal-overlay" id="genInvoiceModal">
  <div class="modal">
    <div class="modal-header"><span class="modal-title">Generate Invoice</span><button class="modal-close" onclick="closeModal('genInvoiceModal')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="modal-body">
      <input type="hidden" id="genInvoicePoId"/>
      <div class="form-group" style="margin-bottom:14px"><label class="form-label">Due Date</label><input class="form-input" id="invDueDate" type="date"/></div>
      <div class="form-group"><label class="form-label">Notes</label><textarea class="form-textarea" id="invNotes" placeholder="Invoice notes..."></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('genInvoiceModal')">Cancel</button>
      <button class="btn btn-primary" id="genInvoiceBtn" onclick="generateInvoice()"><div class="btn-spinner"></div><span class="btn-label">Generate Invoice</span></button>
    </div>
  </div>
</div>

<script src="/procurement/procurement.js"></script>
<script>
fetch('/procurement/sidebar.html').then(r=>r.text()).then(h=>{document.getElementById('sidebarMount').innerHTML=h;initProcurementPage('purchase-orders');loadPOs(1);});
let debounceTimer,currentPage=1;
function debouncedLoad(){clearTimeout(debounceTimer);debounceTimer=setTimeout(()=>loadPOs(1),350);}

async function loadPOs(page=1){
  currentPage=page;
  const search=document.getElementById('searchInput').value.trim();
  const status=document.getElementById('statusFilter').value;
  const params=new URLSearchParams({page,limit:15});
  if(search)params.set('search',search);if(status)params.set('status',status);
  document.getElementById('posBody').innerHTML='<tr><td colspan="9"><div class="empty-state"><p>Loading...</p></div></td></tr>';
  try{
    const d=await apiGet('/purchase-orders?'+params.toString()); if(!d.success)return;
    renderPOs(d.data.purchase_orders);
    renderPagination('posPagination',d.data.pagination,loadPOs);
  }catch(e){showToast('Error','error');}
}

function renderPOs(pos){
  const tbody=document.getElementById('posBody');
  if(!pos.length){tbody.innerHTML='<tr><td colspan="9"><div class="empty-state"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><h3>No purchase orders</h3><p>Generate POs from approved RFQs</p></div></td></tr>';return;}
  tbody.innerHTML=pos.map(po=>`<tr>
    <td><span style="font-weight:700;color:var(--accent)">${po.po_number}</span></td>
    <td><div class="td-name">${po.vendor_name||'—'}</div><div class="td-muted">${po.vendor_email||''}</div></td>
    <td style="font-size:13px">${po.rfq_title||'—'}</td>
    <td style="font-weight:700;font-size:14px">${formatCurrency(po.amount)}</td>
    <td class="td-muted">${formatDate(po.issued_at)}</td>
    <td class="td-muted">${formatDate(po.delivery_date)}</td>
    <td>${statusBadge(po.status)}</td>
    <td>${po.invoice_number?`<span style="font-size:12px;font-weight:600;color:var(--green)">${po.invoice_number}</span>`:`<span class="td-muted">—</span>`}</td>
    <td><div class="td-actions">
      ${!po.invoice_number&&['issued','acknowledged','delivered'].includes(po.status)?`<button class="btn btn-accent btn-sm" onclick="openGenInvoice('${po.id}')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg> Invoice</button>`:''}
    </div></td>
  </tr>`).join('');
}

function openGenInvoice(poId){
  document.getElementById('genInvoicePoId').value=poId;
  const dt=new Date(Date.now()+30*24*60*60*1000).toISOString().slice(0,10);
  document.getElementById('invDueDate').value=dt;
  document.getElementById('invNotes').value='';
  openModal('genInvoiceModal');
}

async function generateInvoice(){
  const poId=document.getElementById('genInvoicePoId').value;
  const dueDate=document.getElementById('invDueDate').value;
  const notes=document.getElementById('invNotes').value.trim();
  const btn=document.getElementById('genInvoiceBtn');
  setLoading(btn,true);
  try{
    const d=await apiPost('/invoices',{po_id:poId,due_date:dueDate,notes});
    if(d.success){closeModal('genInvoiceModal');showToast(`Invoice ${d.invoice.invoice_number} generated!`,'success');loadPOs(currentPage);}
    else showToast(d.message||'Failed','error');
  }catch(e){showToast('Error','error');}
  setLoading(btn,false);
}
</script>
</body></html>
