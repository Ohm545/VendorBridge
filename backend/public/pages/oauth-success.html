<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signing in... — VendorBridge</title>
  <link rel="stylesheet" href="auth.css"/>
  <style>
    .oauth-loading {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 48px;
      text-align: center;
    }
    .oauth-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--ink);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .oauth-loading h2 { font-size: 22px; font-weight: 700; color: var(--ink); }
    .oauth-loading p  { font-size: 14px; color: var(--mid); }
  </style>
</head>
<body class="auth-page">
  <nav class="auth-nav">
    <a href="../index.html" class="auth-nav-logo">
      <div class="auth-nav-logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
      </div>
      VendorBridge
    </a>
  </nav>

  <div class="oauth-loading">
    <div class="oauth-spinner"></div>
    <h2>Signing you in with Google...</h2>
    <p>Please wait while we set up your session.</p>
  </div>

  <script>
    // Extract params from URL
    const params   = new URLSearchParams(window.location.search);
    const token    = params.get('token');
    const redirect = params.get('redirect') || '/procurement/dashboard';
    const role     = params.get('role');

    if (token) {
      // Store JWT in localStorage for client-side use
      localStorage.setItem('vb_token', token);
      localStorage.setItem('vb_role',  role || '');
      // Redirect to appropriate dashboard
      setTimeout(() => {
        window.location.href = redirect;
      }, 1200);
    } else {
      window.location.href = '/pages/login.html?error=google_auth_failed';
    }
  </script>
</body>
</html>
