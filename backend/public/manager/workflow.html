<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Workflow Monitor — VendorBridge Manager</title>
<link rel="stylesheet" href="/manager/manager.css"/></head>
<body>
<div class="admin-layout">
  <div id="sidebarMount"></div>
  <div class="main-content">
    <header class="topbar">
      <button class="topbar-btn topbar-hamburger" id="hamburger"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="topbar-title">Workflow Monitor <span class="topbar-subtitle">Full procurement pipeline view</span></div>
      <div class="topbar-actions">
        <button class="topbar-btn" onclick="loadWorkflow()" title="Refresh"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
        <a href="/manager/notifications" class="topbar-btn" style="position:relative"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-dot" id="notifDot" style="display:none"></span></a>
      </div>
    </header>
    <main class="page-body">
      <div class="page-header">
        <div class="page-header-left"><h1>Workflow Monitor</h1><p>Monitor the complete procurement pipeline and health</p></div>
      </div>

      <!-- Pipeline KPIs -->
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px" id="wfKpis">
        <div class="skeleton" style="height:80px;border-radius:14px"></div>
        <div class="skeleton" style="height:80px;border-radius:14px"></div>
        <div class="skeleton" style="height:80px;border-radius:14px"></div>
        <div class="skeleton" style="height:80px;border-radius:14px"></div>
      </div>

      <!-- Health Filters -->
      <div class="tabs">
        <div class="tab active" onclick="filterHealth('',this)">All RFQs</div>
        <div class="tab" onclick="filterHealth('pending_approval',this)">⏳ Awaiting Approval</div>
        <div class="tab" onclick="filterHealth('no_quotes',this)">📭 No Quotes</div>
        <div class="tab" onclick="filterHealth('overdue',this)">🔴 Overdue</div>
        <div class="tab" onclick="filterHealth('over_budget',this)">💸 Over Budget</div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="filters-bar" style="margin:0;flex:1">
            <div class="search-wrap"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input class="search-input" id="searchInput" placeholder="Search RFQs..." oninput="debouncedLoad()"/></div>
            <select class="filter-select" id="statusFilter" onchange="loadPipeline(1)">
              <option value="">All Stages</option>
              <option value="draft">Draft</option><option value="active">Active</option>
              <option value="quotation_received">Quotation Received</option>
              <option value="pending_approval">Pending Approval</option>
              <option value="approved">Approved</option><option value="rejected">Rejected</option>
              <option value="po_generated">PO Generated</option>
              <option value="invoice_generated">Invoice Generated</option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table><thead><tr><th>RFQ Title</th><th>Category</th><th>Created By</th><th>Budget</th><th>Deadline</th><th>Vendors</th><th>Quotes</th><th>Min Quote</th><th>Stage</th><th>Health</th><th>Action</th></tr></thead>
          <tbody id="pipelineBody"></tbody></table>
        </div>
        <div class="pagination" id="pipelinePagination"></div>
      </div>
    </main>
  </div>
</div>
<script src="/manager/manager.js"></script>
<script>
fetch('/manager/sidebar.html').then(r=>r.text()).then(h=>{document.getElementById('sidebarMount').innerHTML=h;initManagerPage('workflow');loadWorkflow();});
let debounceTimer,currentPage=1,currentHealth='';
function debouncedLoad(){clearTimeout(debounceTimer);debounceTimer=setTimeout(()=>loadPipeline(1),350);}
function filterHealth(h,el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');currentHealth=h;loadPipeline(1);}

async function loadWorkflow(){ await Promise.all([loadWfStats(),loadPipeline(1)]); }

async function loadWfStats(){
  try{
    const d=await apiGet('/workflow/stats');if(!d.success)return;
    const s=d.data;
    document.getElementById('wfKpis').innerHTML=`
      <div class="kpi-card"><div class="kpi-card-top"><span class="kpi-label">Active RFQs</span><div class="kpi-icon blue"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg></div></div><div class="kpi-value">${s.active_rfqs||0}</div><div class="kpi-footer">${s.waiting_quotes||0} waiting for quotes</div></div>
      <div class="kpi-card"><div class="kpi-card-top"><span class="kpi-label">Pending Approval</span><div class="kpi-icon orange"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div></div><div class="kpi-value">${s.pending_approval||0}</div><div class="kpi-footer">Require your action</div></div>
      <div class="kpi-card"><div class="kpi-card-top"><span class="kpi-label">POs Generated</span><div class="kpi-icon green"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></div></div><div class="kpi-value">${s.po_generated||0}</div><div class="kpi-footer">${s.invoice_generated||0} invoiced</div></div>
      <div class="kpi-card"><div class="kpi-card-top"><span class="kpi-label">Overdue</span><div class="kpi-icon red"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg></div></div><div class="kpi-value">${s.overdue||0}</div><div class="kpi-footer">${s.due_soon||0} due in 3 days</div></div>`;
  }catch(e){}
}

async function loadPipeline(page=1){
  currentPage=page;
  const search=document.getElementById('searchInput').value.trim();
  const status=document.getElementById('statusFilter').value;
  const params=new URLSearchParams({page,limit:15});
  if(search)params.set('search',search);if(status)params.set('status',status);
  if(currentHealth&&currentHealth!=='pending_approval')params.set('health',currentHealth);
  else if(currentHealth==='pending_approval'){params.set('status','pending_approval');}

  document.getElementById('pipelineBody').innerHTML='<tr><td colspan="11"><div class="empty-state"><p>Loading...</p></div></td></tr>';
  try{
    const d=await apiGet('/workflow/pipeline?'+params.toString());if(!d.success)return;
    renderPipeline(d.data.rfqs);
    renderPagination('pipelinePagination',d.data.pagination,loadPipeline);
  }catch(e){showToast('Error','error');}
}

function renderPipeline(rfqs){
  const tbody=document.getElementById('pipelineBody');
  if(!rfqs.length){tbody.innerHTML='<tr><td colspan="11"><div class="empty-state"><h3>No RFQs found</h3><p>Adjust your filters</p></div></td></tr>';return;}
  tbody.innerHTML=rfqs.map(r=>`<tr>
    <td><div class="td-name">${r.title}</div></td>
    <td>${r.product_category?`<span class="badge badge-info">${r.product_category}</span>`:'<span class="td-muted">—</span>'}</td>
    <td style="font-size:13px">${r.created_by_name||'—'}</td>
    <td style="font-size:13px;font-weight:600">${r.expected_budget?formatCurrency(r.expected_budget):'—'}</td>
    <td class="td-muted" style="${new Date(r.deadline)<new Date()&&!['closed','cancelled','po_generated','invoice_generated'].includes(r.status)?'color:var(--red);font-weight:600':''}">
      ${formatDate(r.deadline)}</td>
    <td style="text-align:center;font-weight:600">${r.vendor_count||0}</td>
    <td style="text-align:center;font-weight:600">${r.quotation_count||0}</td>
    <td style="font-size:13px;font-weight:700;color:var(--green)">${r.min_quote?formatCurrency(r.min_quote):'—'}</td>
    <td>${statusBadge(r.status)}</td>
    <td>${statusBadge(r.health||'on_track')}</td>
    <td>${r.approval_status==='pending'?`<a href="/manager/approvals" class="btn btn-warning btn-sm">Review</a>`:
        r.status==='pending_approval'?`<a href="/manager/approvals" class="btn btn-primary btn-sm">Approve</a>`:'<span class="td-muted">—</span>'}</td>
  </tr>`).join('');
}
</script>
</body></html>
